name: Android preview APK
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_NO_TELEMETRY: 1
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: npm ci
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: npx expo prebuild --platform android --no-install
      # Expo's generated release variant bundles JS and uses the generated debug
      # signing key. This is a standalone classroom prototype, not store signing.
      - run: ./gradlew --no-daemon :app:assembleRelease -PreactNativeArchitectures=arm64-v8a --max-workers=2
        working-directory: android
      - run: |
          mkdir -p apk-output
          cp android/app/build/outputs/apk/release/app-release.apk apk-output/EcoSort-AI-preview.apk
          sha256sum apk-output/EcoSort-AI-preview.apk > apk-output/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: EcoSort-AI-preview
          path: apk-output/
          retention-days: 1
          if-no-files-found: error

